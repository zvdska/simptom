  :root { --ink:#ffffff; --void:#040404; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; background:var(--void); }

  /* --- видео на весь экран, обложки нет ---
     object-fit:contain, а не cover: ролик 9:16, снят на чёрном фоне,
     поэтому поля по краям сливаются с фоном страницы на любом экране,
     а кадр нигде не обрезается */
  .clip { position:fixed; inset:0; z-index:0; }
  .clip video, .clip .poster { position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:cover; background:var(--void); }
  .p-land { display:none; }
  @media (orientation: landscape) { .p-port { display:none; } .p-land { display:block; } }
  .clip video { opacity:0; transition:opacity .8s ease; }
  .clip.playing video { opacity:1; }
  .clip.playing .poster { opacity:0; }
  .clip .poster { opacity:1; transition:opacity .8s ease; }

  /* --- площадки --- */
  .wrap { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding:0 0 calc(env(safe-area-inset-bottom) + 15vh);
    pointer-events:none; }
  /* подложка, чтобы белые логотипы читались поверх светлых кадров */
  .wrap::before { content:''; position:absolute; left:0; right:0; bottom:0; height:46vh;
    background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,0) 100%);
    pointer-events:none; }
  .platforms { position:relative; display:flex; align-items:center; justify-content:center;
    gap:clamp(12px,4.4vw,24px); width:100%; padding:0 16px; pointer-events:auto;
    opacity:0; transform:translateY(16px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }

  /* --- таймер до релиза --- */
  .timer { position:relative; font-family:'Aviano',Georgia,serif;
    font-size:clamp(26px,8.6vw,44px); letter-spacing:.04em; line-height:1;
    color:var(--ink); white-space:nowrap; pointer-events:none;
    font-variant-numeric:tabular-nums;
    opacity:0; transform:translateY(14px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1); }
  .timer.show { opacity:1; transform:none; }
  .timer .c { opacity:.55; }
  @media (min-width: 768px) { .timer { font-size:52px; } }

  .pbtn { cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:10px 0; transition:transform .16s ease, opacity .2s ease; }
  .pbtn img { height:clamp(15px,4.5vw,19px); width:auto; display:block; }
  .pbtn.p-spotify img { height:clamp(16px,4.9vw,21px); }
  .pbtn:active { transform:scale(.92); opacity:.55; }
  .pbtn.p-apple   { transition-delay:0s; }
  .pbtn.p-spotify { transition-delay:.05s; }
  .pbtn.p-youtube { transition-delay:.1s; }
  .pbtn.p-deezer  { transition-delay:.15s; }

  @media (min-width: 768px) {
    /* в широком ролике картинка опускается до 85% высоты и упирается в таймер,
       поэтому на пк поджимаем видео кверху и вписываем целиком */
    .clip { bottom:17%; }
    .clip video, .clip .poster { object-fit:contain; }
    .wrap { padding-bottom:13vh; }
    .platforms { max-width:680px; gap:42px; }
    .pbtn img { height:24px; }
    .pbtn.p-spotify img { height:26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .platforms { transition:none; opacity:1; transform:none; }
    .clip video, .clip .poster { transition:none; }
  }
</style>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#040404'); tg.setBackgroundColor('#040404'); }

  const clip = document.getElementById('clip');
  const vid = document.getElementById('vid');
  const platforms = document.getElementById('platforms');

  // под телефон и под пк — разные ролики. Атрибут media у <source> для video
  // браузеры не поддерживают (он работает только в <picture>), поэтому выбираем сами
  const wide = window.innerWidth > window.innerHeight;
  const base = wide ? 'bg-desktop' : 'bg-mobile';
  [['mp4','video/mp4'], ['webm','video/webm']].forEach(([ext, type]) => {
    const src = document.createElement('source');
    src.src = '/' + base + '.' + ext; src.type = type;   // от корня, чтобы работало и из /neverland/
    vid.appendChild(src);
  });
  vid.load();

  vid.muted = true; vid.defaultMuted = true;
  const kick = () => vid.play?.().catch(()=>{});
  kick();
  window.addEventListener('load', kick);
  document.addEventListener('touchstart', kick, { once:true });
  const reveal = () => clip.classList.add('playing');
  if (vid.readyState >= 2) reveal();
  vid.addEventListener('loadeddata', reveal);
  vid.addEventListener('playing', reveal);

  // 23 октября 2026, 00:00 по Киеву (UTC+3) — указано как момент в UTC,
  // чтобы отсчёт был одинаковым у зрителя в любом часовом поясе
  const RELEASE_AT = Date.UTC(2026, 9, 22, 21, 0, 0);
  const timer = document.getElementById('timer');
  const pad = n => String(n).padStart(2, '0');
  let shown = false;

  function render() {
    const left = RELEASE_AT - Date.now();
    if (left <= 0) {
      timer.hidden = true;
      if (platforms.hidden) {
        platforms.hidden = false;
        requestAnimationFrame(() => platforms.classList.add('show'));
      }
      return false;
    }
    const s = Math.floor(left / 1000);
    timer.innerHTML = pad(Math.floor(s / 86400)) + '<span class="c">:</span>'
                    + pad(Math.floor(s / 3600) % 24) + '<span class="c">:</span>'
                    + pad(Math.floor(s / 60) % 60) + '<span class="c">:</span>'
                    + pad(s % 60);
    if (!shown) {
      shown = true; timer.hidden = false;
      requestAnimationFrame(() => timer.classList.add('show'));
    }
    return true;
  }

  if (render()) {
    const id = setInterval(() => { if (!render()) clearInterval(id); }, 1000);
    // вкладку могли свернуть — пересчитываем при возврате
    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  }

  // === Google Analytics ===
  // Вставь сюда идентификатор вида G-XXXXXXXXXX из analytics.google.com.
  // Пока строка пустая — аналитика не грузится вообще, страница работает как есть.
  const GA_ID = "G-3M6T8W5B6X";

  if (GA_ID) {
    const ga = document.createElement('script');
    ga.async = true;
    ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(ga);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', GA_ID);
  }

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "never-land";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    // то же событие уходит и в Google Analytics, если он подключён
    window.gtag?.('event', 'platform_click', { platform: platform, release: TRACK_SLUG });
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
</body>
</html>
